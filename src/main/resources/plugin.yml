name: Asonsss_manhunt
version: '1.6.0'
main: me.asonsss.manhunt.AsonsssManhunt
api-version: '1.21'
authors: [Asonsss]
description: Custom Manhunt plugin v1.6.0 (30s speedrunner hit-to-start window, death teleport fix)

commands:
  manhunt:
    description: Основная команда управления Manhunt
    usage: /<command> <speedruner|hunter|game|difficulty|info>
    aliases: [speedrun]
  sp:
    description: Команда настройки игры для Спидранера
    usage: /<command> <difficulty|pickplace|restart>
  ready:
    description: Подтвердить готовность к началу игры
    usage: /<command>
  unready:
    description: Отменить готовность к началу игры
    usage: /<command>
  pause:
    description: Поставить игру на паузу (до 180 секунд)
    usage: /<command> <Время в секундах>
    aliases: [p]
  stop:
    description: Остановить игру на неопределённый срок (с сохранением состояния на диск)
    usage: /<command>
  resume:
    description: Возобновить игру после команды /stop
    usage: /<command>
  fortrest:
    description: Показать координаты ближайшей Адской Крепости (только на Легкой сложности в Аду)
    usage: /<command>
  compass:
    description: Получить Компас Охотника (только для охотников во время игры)
    usage: /<command>
    aliases: [c]
